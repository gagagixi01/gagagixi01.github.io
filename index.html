<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>课程</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #eef3f8;
      color: #172033;
      font: 1rem/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    main {
      width: min(100% - 2rem, 42rem);
      margin: clamp(3rem, 13vh, 9rem) auto;
    }
    h1 { margin: 0 0 1rem; font-size: clamp(2rem, 5vw, 3rem); }
    a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: clamp(1rem, 4vw, 1.75rem);
      border-radius: 0.75rem;
      background: #0e1b33;
      color: #fff;
      font-size: clamp(1.05rem, 2.4vw, 1.3rem);
      font-weight: 650;
      text-decoration: none;
    }
    a:hover { background: #19335a; }
    a:focus-visible { outline: 3px solid #2563eb; outline-offset: 4px; }
  </style>
</head>

  <main>
    <h1>课程</h1>
    <a href="ai-chips/">
